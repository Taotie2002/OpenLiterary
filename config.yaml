# =====================================================================
# SagaTrans 运行配置
# =====================================================================
#
# 事实源与覆盖顺序：
#   1. 本文件是持久配置的唯一事实源。
#   2. api_key 使用 ${ENV} 占位符；值优先从项目根 .env 读取，shell 同名
#      变量只在 .env 缺项时兜底。
#   3. SAGATRANS__<PATH> 可临时覆盖嵌套键；__ 表示层级分隔符，仅用于
#      CI、排障和一次性实验，不作为日常配置。
#   4. 不要把真实密钥写入本文件或提交到 Git。
#
# 主要分区：
#   models / llm_backend / openai_api / task_routing   模型与任务路由
#   pipeline / review_fix / judgment_injection       生成、回流与判断注入
#   story_graph / chunker / input_prep               知识图谱、切分与输入准备
#   decision_engine / critic_thresholds              一致性与质量门槛
#   typesafe_thresholds / typesafe                   System One 阈值与后端
#   style_guide / book / verse                       全局风格与交付形态
#
# 思考档位（effort）是任务级参数，写在 task_routing.<task>.effort：
#   MiniMax:  low / medium / high / xhigh / max（无 none）
#   DeepSeek: none / low / high / xhigh / max（none=显式关闭）
#   Qwen:     none / low / medium / xhigh（none=显式关闭）
#   不写 effort = 不下发该参数。关闭思考必须写字符串 "none"；YAML 裸 off
#   会解析为布尔 false，代码虽兼容归一，但不应在新配置中这样写。
# =====================================================================

# ── 模型角色（唯一模型定义处） ─────────────────────────────────────
# 每个角色只定义连接与模型名；temperature、max_tokens、effort 等均在
# task_routing 按任务覆盖。
models:
  literal_translator:
    api_base: https://token.ai-hf.cn/v1
    api_key: ${QWEN_API_KEY}
    model_name: Qwen3.8-Flash-Next-SS

  primary:
    api_base: https://api.minimax.cn/v1
    api_key: ${MINIMAX_API_KEY}
    model_name: MiniMax-M3.1-Flash
    # 配额/持续限流耗尽时，primary 角色在进程内单向降级到该角色。
    # 降级不会自动回切；重启进程后恢复 primary。
    fallback_role: secondary

  secondary:
    api_base: https://token.ai-hf.cn/v1
    api_key: ${DEEPSEEK_API_KEY}
    model_name: Deepseek-V4.1-Flash-1017-SS

# ── 全局后端与 HTTP 传输 ───────────────────────────────────────────
# openai_api = 正常生产；mock = 不调用真实模型，仅用于 dry-run/回归。
llm_backend: openai_api

# OpenAI-compatible HTTP 客户端的全局参数；角色级同名键可覆盖。
openai_api:
  max_retries: 3              # 单次 API 调用的重试上限
  retry_delay: 5.0            # 指数退避基数：5s → 10s → 20s
  request_timeout: 300        # 单请求超时（秒）；自建网关约 300s 硬顶

# ── 任务路由 ───────────────────────────────────────────────────────
# model 必须是 models 下的角色 key；params_override 合并到调用参数。
# max_tokens 是 completion 预算，包含 reasoning/thinking 与正文，不是上下文窗口。
task_routing:
  reference_extraction:        # 典故、隐喻、实体召回
    model: literal_translator
    effort: "none"             # 低档思考在该网关会超时；关闭后稳定出 JSON
    params_override:
      temperature: 0.1
      max_tokens: 12000

  reference_confirmation:      # 对召回转录做逐条确认
    model: secondary
    effort: low                # 深核验可临时改 xhigh，但需注意 300s 网关上限
    params_override:
      temperature: 0.1
      max_tokens: 30000

  literal_translation:         # 普通直译；困难片段会被 difficulty_routing 接管
    model: literal_translator
    effort: "none"
    params_override:
      temperature: 0.1
      max_tokens: 60000        # 兼顾切到 primary:xhigh 的高思考路径

  name_vetting:                # 一字漂移候选的轻量二分类裁决
    model: literal_translator
    effort: "none"
    params_override:
      temperature: 0.0
      max_tokens: 4000

  literary_rewrite:            # 文学润色
    model: secondary
    effort: xhigh              # A/B 显示 max 无稳定质量增益但延迟/失败率更高
    params_override:
      temperature: 0.6
      max_tokens: 60000        # 双稿/停滞救稿可能切到 primary:max

  critic_scoring:              # 旧 LLM critic 路径；默认校准路径走 System One
    model: secondary
    effort: "none"
    params_override:
      temperature: 0.1
      max_tokens: 8000

  judge_decision:              # LLM 最终裁决与第二意见
    model: primary
    effort: max
    params_override:
      temperature: 0.3
      max_tokens: 60000

  style_profiling:             # 抽样风格剖面（全书只跑少量样本）
    model: primary
    effort: max
    params_override:
      temperature: 0.2
      max_tokens: 60000

  style_profiling_deep:        # 全书分段深读；避开 MiniMax 配额
    model: secondary
    effort: xhigh
    params_override:
      temperature: 0.2
      max_tokens: 60000

  style_profiling_merge:       # 深读注记跨段归并；低思考即可
    model: secondary
    effort: low
    params_override:
      temperature: 0.1
      max_tokens: 30000

  judgment_verify:             # 判断层 L2：小批证据复核
    model: literal_translator
    effort: "none"
    params_override:
      temperature: 0.0
      max_tokens: 12000

  editor_review:               # 逐章成书级审读
    model: primary
    effort: max
    params_override:
      temperature: 0.2
      max_tokens: 60000

  editor_review_global:        # --global：分段审读 + 全书注记上下文
    model: secondary
    effort: xhigh
    params_override:
      temperature: 0.2
      max_tokens: 60000

  story_graph_query:           # 故事图检索的可选 LLM 证据复核
    model: secondary
    effort: "none"
    params_override:
      temperature: 0.0
      max_tokens: 12000

  setup_payoff_audit:          # 伏笔回收：只从候选场景中选 payoff
    model: secondary
    effort: low
    params_override:
      temperature: 0.0
      max_tokens: 20000

# ── 流水线调度与质量闭环 ───────────────────────────────────────────
# 章内与跨章默认串行，避免 Decision DB / workflow DB 的写竞态。
pipeline:
  batch_size: 10                   # 调度器每批取出的任务数
  max_retries: 3                   # API/执行失败重试上限；耗尽后进入 PF
  max_quality_retries: 5           # 质量不达标时允许的润色重试轮数
  max_quality_retries_entity: 4    # 实体一致性问题的独立重试上限
  judge_safety_net_avg_min: 5.5    # Judge PASS 但 critic 均分低于此值 → 改判 REJECT

  # REJECT 后由 judge_decision 角色补一份可执行的编辑意见；只补指令，不改裁决。
  judge_second_opinion:
    enabled: true
    max_edits: 20
    temperature: 0.2

  # 考据先高召回，再由确认角色逐条剔除误报。
  reference_two_stage:
    enabled: true
    max_recall_chars: 12000

  # 典故密度、长句和引文达到阈值时，把直译切到更强角色并提高 effort。
  difficulty_routing:
    enabled: true
    hard_threshold: 2.0
    hard_role: primary
    hard_effort: xhigh

  # 命中“只有推理、没有正文”等签名时自动降档；预算耗尽后换角色救稿。
  # 这些覆盖按 chunk 持久化到 workflow.db。
  retry_adaptation:
    enabled: true
    downgrade_on_signature: ["no_content"]
    fallback_role_switch: true
    minimax_protect: true
    quality_escalate_back: true
    # HTTP 422 / input new_sensitive 是永久客户端拒绝：首个拒绝即换角色，
    # 不在同一 provider + 同一 prompt 上空转。首选跨 provider 的 primary，
    # 再试已成功产出 raw 的 literal_translator（Qwen）。
    sensitive_fallback_roles: ["primary", "literal_translator"]

  # 失败块自动救援：先复用 raw/literary 做 cheap-first 续跑，再整块重跑。
  # targeted 用完后仍失败则整块重跑一次；两者都耗尽才进入隔离态 PF。
  # chapter_budget_seconds 是单章救援增量墙钟上限，防止失败块拖垮整书。
  rescue:
    enabled: true
    max_targeted_attempts: 2
    max_full_requeues: 1
    chapter_budget_seconds: 1800

  # tools/probe_llm_efforts.py 的探测结果；pipeline 只读，过期则忽略。
  model_probe:
    path: db/model_capabilities.json
    ttl_days: 7
    tiny_max_tokens: 16

  # 候选稿定稿时的两两配对仲裁；不可用或平票时回退到 critic 分最高稿。
  pairwise_arbitration:
    enabled: true
    min_confidence: 0.6
    max_candidates: 4

  # 韵文/双关密集片段生成第二稿，按 pairwise → critic → 首稿顺序择优。
  dual_draft:
    enabled: true
    alternate_role: primary
    alternate_effort: max
    max_chunks: 25

  # 黄金集模型×档位 A/B 中，只有校准裁决占比达标的组合才参与推荐。
  golden_ab:
    min_calibrated_ratio: 0.5

  # 交付门禁第 ⑧ 项：最终 chunk 的 critic 报告必须主要由校准后端产出。
  # "jev" 是现役 MoArk d3 路径保留的兼容标签；legacy/openai_compat/mock
  # 均属未校准路径。阈值同时按全书和单章检查。
  final_gate:
    enforce_calibrated_ratio: true
    min_calibrated_ratio: 0.95
    calibrated_backends: ["jev"]

  # 章级语域漂移审计的统计窗口与告警阈值。
  drift_audit:
    window: 5
    trend_threshold: 0.25
    sentence_len_tolerance: 0.30

  # CJK 完整性闸门：final 低于阈值时回退 literary/raw；raw 低于阈值则重试。
  final_cjk_threshold: 0.5
  cjk_max_retries: 3
  min_raw_cjk_ratio: 0.3

  # 实体违规/评分停滞/不进步/振荡的早停参数。早停始终仅在第一轮质量裁决生效。
  entity_stagnation_threshold: 3
  no_progress_window: 4
  score_decline_streak: 4
  poll_interval: 0.5

  # 首轮审计分数高、无实体违规且 CJK 正常时可跳过 judge LLM。
  audit_high_pass:
    enabled: true
    high_score_threshold: 8.0

  # 严重实体问题强制回润色；质量重试已发生后，仅当严重项超过阈值才继续退化。
  entity_hard_fail: true
  entity_hard_fail_degradation_threshold: 3

  # 一字漂移候选的发现门槛。自动入表默认关闭，避免普通词污染注册表。
  variant_min_occurrence: 2
  variant_auto_register: false
  variant_min_auto_len: 3

  # 译后一致性修正默认只出报告；CLI `consistency --apply` 不受此开关限制。
  consistency_auto_fix: false

  early_stop:
    enabled: true
    max_low_dims: 3               # 低分维度数达到此值即止损
    low_score_threshold: 4.0

  # mock_heuristic 的分数不是概率；生产默认不信任其 verdict/早停信号。
  trust_mock_heuristic: false

  # 连续重试文本高度相似，或拒绝理由类别不再变化，则提前 fallback。
  oscillation_detection:
    enabled: true
    similarity_threshold: 0.95
    consecutive_required: 2
    stagnation_detection:
      enabled: true
      consecutive_required: 1
      # category 比较问题类别集合，避免概率浮动被误判为“新问题”。
      match_mode: category

  # 字节级停滞时换到另一模型再试一轮；不占 quality_retries 计数。
  stagnation_model_switch:
    enabled: true
    alternate_role: primary
    alternate_effort: max
    max_switches: 1

  # 章节完成后运行一致性 pass；生产默认限制在当前章。
  post_consistency:
    enabled: true
    chapter_scoped: true

  # allow 类别名只登记不替换；replace 类译名漂移全文统一。
  # LLM 不可用或不确定时保守不改；preferred_forms 可人工覆盖 {旧形: 首选形}。
  name_unification:
    enabled: true
    llm_vetting: true
    preferred_forms: {}

  # 纯诊断：漏译实体与同源多 canonical 冲突分别写章级报告。
  entity_audit:
    enabled: true
    min_chunk_missing_threshold: 1
  entity_registry_audit:
    enabled: true

  # 章末成本报告。
  cost_report:
    enabled: true

  # 回溯重跑得到的新稿只有在 critic 均分不低于备份稿时才允许替换。
  version_merit:
    enabled: true
    tolerance: 0.0

  # 清理 COMPLETED chunk 的历史 literary_vN/rewrite_meta_vN；
  # 每条链的最后一版始终保留。PF chunk 默认保留全部中间产物供排障。
  intermediate_cleanup:
    enabled: true
    preserve_for_failed: true

# ── 全书判断层（advisory，不是硬约束） ─────────────────────────────
# 深读注记只提供语气、弧线与伏笔提示；术语/译名等硬约束仍归 Decision DB。
# 当前注入默认关闭：真实同章 A/B 未证明 critic 收益，深读制品继续供故事图
# 和 editor_review --global 使用。重新开启前应先跑 judgment A/B。
judgment_injection:
  enabled: false
  max_chars: 300               # 每个生成 prompt 的注记预算
  min_confidence: 0.55         # 只注入 L1∧L2 通过且达标的 active 注记
  max_notes: 6
  prompt_version: r131

# ── 故事知识图谱 ───────────────────────────────────────────────────
# 图谱由 Decision DB/实体注册表与章源确定性地构建，叠加通过验证的叙事注记；
# 它是只读派生制品，不反向成为术语事实源。
story_graph:
  enabled: true
  path: input/story_graph.json
  cooccur_window: 600          # 同章实体共现字符窗口
  max_cooccur_edges: 600       # 共现边上限，按频次截断
  entity_coverage_min: 0.5     # 可信实体覆盖率低于此值时关闭图上下文
  scene_chars: 2200            # 场景装箱目标长度；标题/分隔线强制断场

# ── 终审结构修复 ───────────────────────────────────────────────────
review_fix:
  # 结构 P0 修复不被 critic 均分回滚，由后续 lint/gate/悬空检查复核。
  # 每个 chunk 的治理预算复用 decision_engine 的回溯/PF 预算。
  structural_p0_bypass_merit: true

# ── 文本切分与输入预处理 ───────────────────────────────────────────
chunker:
  soft_limit: 1000             # 达到后优先在场景断点切分
  hard_limit: 2500             # 超过后强制切分

input_prep:
  enabled: true
  skip_dir: _skip
  # H1 命中以下标题（忽略大小写/空白）的非正文文档移入 _skip/。
  skip_titles:
    - "Cover Page"
    - "Title Page"
    - "Copyright Page"
    - "Dedication"
    - "Contents"
    - "Index"
    - "Document Outline"
  # EPUB 转 Markdown 后的字间断裂修复表；按顺序全局替换。
  repairs:
    - ["SO CLOSE AND YE T SO DIFFERENT", "SO CLOSE AND YET SO DIFFERENT"]
    - ["PROS PERITY", "PROSPERITY"]
    - ["A ND IT WORKS", "AND IT WORKS"]
    - ["TURNI NG", "TURNING"]
    - ["BAR RIERS", "BARRIERS"]
    - ["D EVELOPMENT", "DEVELOPMENT"]
    - ["EIGHTEENTH - CENTURY", "EIGHTEENTH-CENTURY"]
    - ["MID - NINETEENTH CENTURY", "MID-NINETEENTH-CENTURY"]
    - ["DRIFTIN\n\nG APART", "DRIFTING APART"]
    - ["VIRTUO US", "VIRTUOUS"]
    - ["VICIOU S", "VICIOUS"]
    - ["T HE MOLD", "THE MOLD"]
    - ["UNDERSTANDING PROS\n\nPERITY AND POVERTY", "UNDERSTANDING PROSPERITY AND POVERTY"]

# ── 决策回溯引擎 ───────────────────────────────────────────────────
# 新决策影响已完成 chunk 时，只有 COMPLETED 可转 DIRTY；中间态不自动自脏。
decision_engine:
  terminology_triggers_backtrack: true
  reference_triggers_backtrack: true
  style_triggers_backtrack: false       # 风格规则只供后续 chunk 继承
  max_affected_chunks_per_decision: 50
  backtrack_scope: book                 # book | chapter
  backtrack_mode: deferred              # deferred | immediate
  max_backtrack_sweeps_per_chapter: 1   # 0=不在本章消费队列
  max_backtrack_rounds_per_chunk: 2     # 0=不限制
  pf_requeue_max: 1                     # PF 终态块的自动复活预算；0=关闭
  context_max_terminology: 40           # prompt 注入上限
  context_max_reference: 20
  context_max_style: 10
  context_max_entities: 30

# ── Critic 评分参考门槛 ────────────────────────────────────────────
# 0-10 分；book_profile.json 的 critic_thresholds 可按作品逐维覆盖。
# 这里只作为通用基线，不做硬性平均分否决。
critic_thresholds:
  fluency: 6.5
  readability: 6.5
  style_compliance: 6.0
  voice_consistency: 6.0
  semantic_preservation: 6.5
  literal_residue: 6.5

# ── System One 裁决阈值 ────────────────────────────────────────────
# 以 src/judges/verdict.py::DEFAULT_THRESHOLDS 为基线；概率是校准值，不是 LLM 自报。
# literal_residue_noul / semantic_loss_noul 在本作品上高于默认值（0.5/0.4），
# 是有意放宽 hard-reject 边界、提高容忍阈值以降低误杀，不要为了“与默认同步”而改回。
typesafe_thresholds:
  voice_drift_severe_prob: 0.5
  voice_drift_subtle_prob: 0.7
  register_mismatch_prob: 0.4
  entity_consistency_noul: 0.3
  literal_residue_noul: 0.6
  semantic_loss_noul: 0.55
  style_compliance_min_score: 1.0
  style_compliance_min_confidence: 0.6
  low_confidence_threshold: 0.5

  # CJK 的 Choice/Score 使用更高置信门；边界答案进入 skipped 而非硬拒。
  cjk_confidence_gating: true
  cjk_low_confidence_threshold: 0.6
  cjk_hard_threshold: 0.5

  # Noul 概率落入不确定区间时不参与硬拒，避免边界值触发重写死循环。
  noul_uncertain_low: 0.3
  noul_uncertain_high: 0.7
  noul_uncertain_zones:
    entity_consistency: [0.3, 0.7]
    literal_residue: [0.3, 0.8]
    semantic_loss: [0.3, 0.75]

  # 非校准来源只允许作为显式降级路径，并通过更宽 margin 保守处理。
  confidence_source_profiles:
    openai_compat:
      calibrated: false
      reject_margin: 0.15
      confidence_margin: 0.15
    mock_heuristic:
      calibrated: false
      reject_margin: 0.25
      confidence_margin: 0.20

# ── 全局风格基线 ───────────────────────────────────────────────────
# 作品相关字段由 style-profile 生成到 input/book_profile.json，并在运行时覆盖本段。
style_guide:
  avg_sentence_length: 适中、口语化，贴近原文句式长度
  lexicon_preference: 平实、克制，避免过度意译、四字格堆砌与装饰性发明
  author_priority_ratio: 0.7
  genre: 文学小说
  work_type: 长篇小说
  persona: 忠实原著语域的职业文学译者
  footnote_policy: inline          # none | inline | markdown_footnote
  register_default: 保持克制、平实、贴近原文的叙事语域
  translation_hints: []
  forbidden_modernisms:
    - 娘们儿
    - 卧槽
    - 开后宫
    - 老铁
    - 666

# ── System One 判断后端 ────────────────────────────────────────────
# 段名和 JevBackend 类名是历史兼容名；现役 provider 为 MoArk d3-flash。
# API key 只从 .env 的 MOARK_API_KEY 读取。
typesafe:
  enabled: true
  api_base: https://api.moark.com      # SDK 会拼接 /v1/systemone
  api_key: ${MOARK_API_KEY}
  model_name: d3-flash                 # d3-turbo 仅作历史对照，当前无自动 A/B 实现
  max_questions_per_batch: 64
  allow_mock: false                    # 生产禁止未校准启发式冒充裁决
  allow_openai_fallback: false         # OpenAICompat 无校准概率，默认不走
  timeout: 60.0                        # 单批超时；64 问需留足延迟余量

# ── 成书形态 ───────────────────────────────────────────────────────
book:
  # bilingual=中文主标题（原文括注）；zh=仅中文；keep=沿用章源 H1。
  chapter_titles: bilingual
  # 留空自动推断；可显式填写，决定 output/<中文书名>.md 的文件名。
  title_zh: ""

# ── 韵文通道 ───────────────────────────────────────────────────────
verse:
  enabled: true
  min_line_ratio: 0.6          # 译文诗行数 / 源诗行数下限
  max_line_chars: 56           # 超过该长度按散文行处理
  refrain_ratio: 0.5           # 复沓保留比例下限
  retry_on_fail: true          # PASS 定稿前未对齐时触发一次定向重写
