# =====================================================================
# SagaTrans 全局配置
# =====================================================================
#
# 结构总览（按节号自上而下；每节的唯一职责见下）：
#   1. models         模型定义 —— 唯一事实源。每个角色一块，集中写
#                     api_base / api_key / model_name / thinking(Effort)。
#   2. llm_backend    全局后端开关（openai_api | mock）。
#   3. openai_api     HTTP 传输层全局参数（重试/超时/并发）—— 不再定义模型。
#   4. task_routing   任务 → 模型 + 参数覆盖（temperature / max_tokens / thinking）。
#   5+. pipeline / chunker / critic_thresholds / style_guide / … 状态机与质量门槛。
#
# 角色与分工（models 的 key）：
#   literal_translator  直译 / 典故考据召回            (Qwen3.8-Flash-Next-SS, 自建网关)
#   primary             最终裁决 / 风格剖面 / 成书审读   (MiniMax-M3.1-Flash)
#   secondary           文学润色 / 审计评分 / 典故确认   (Deepseek-V4.1-Flash-1017-SS, 自建网关)
#
# Effort（思考档位）约定：
#   - 档位是任务级配置：task_routing.<task>.effort；只写需要的任务，不写=不下发参数。
#   - 合法档位（各家文档口径 + 2026-10 实测，resolve 时按 provider 校验）：
#       MiniMax: low / medium / high / xhigh / max（服务端强制 adaptive，无 none 档）
#       DeepSeek: none / low / high / xhigh / max（none=显式关闭思考）
#       Qwen:    none / low / medium / xhigh（none=显式关闭思考）
#   - 适配层编码：统一 reasoning_effort: <level>；MiniMax 另附 thinking=adaptive。
#   - ⚠️ 关闭思考统一写 none（effort: none 或 "none"）；裸 off 会被 YAML 当布尔
#     false，代码兼容归一为 none 并校验（MiniMax 无 none 档会直接报错）。
#   - 其它供应商特有透传参数写任务级 `task_routing.<task>.extra_body`（最后合并、同名覆盖）。
#
# 配额韧性（Round 129）：
#   - models.primary 配置 fallback_role: secondary —— MiniMax 配额/限流持续耗尽
#     （429 连续 / 配额类 402-403）时，primary 角色自动永久降级到 secondary
#     （DeepSeek），流水线不因配额中断或长时间空转；配额 5 小时窗重置后重启进程恢复。
#   - 降级为进程内单向，避免失败-回切抖动；触发时 stderr 打 [Quota Fallback] 日志。
#
# 临时覆盖（不修改本文件）：环境变量 SAGATRANS__<路径>，__ 为层级分隔符。
#   export SAGATRANS__LLM_BACKEND=openai_api
#   export SAGATRANS__MODELS__PRIMARY__MODEL_NAME=mistral-large
#   export SAGATRANS__MODELS__PRIMARY__API_BASE=https://api.example.com/v1
#   export SAGATRANS__MODELS__PRIMARY__API_KEY=$MISTRAL_KEY
#   （旧路径 SAGATRANS__MAIN__MODELS__… 仍兼容；单下划线旧式写法亦支持）
#
# 敏感字段用 ${ENV} 占位符，运行时从 .env / shell 环境注入（.env 不入库）。
# 说明：本地推理（MLX）支持已移除，models 全部为 OpenAI 兼容 HTTP 后端。
# =====================================================================

# ---------- 1. 模型定义（唯一事实源） ----------
# 每个角色一块：连接（api_base/api_key）+ 模型名（Effort 档位在 task_routing，见第 4 节）。
# 不要在其它段落重复模型定义（旧 main.models / openai_api.models 双落点已废弃）。
# extra_body / effort 均为任务级配置，见第 4 节 task_routing。
models:
  literal_translator:
    alias: "llm(直译)"
    # 自建Qwen网关（非阿里官方 ）
    api_base: https://token.ai-hf.cn/v1
    api_key: ${QWEN_API_KEY}
    model_name: Qwen3.8-Flash-Next-SS

  primary:
    alias: "llm-primary (主力模型)"
    api_base: https://api.minimax.cn/v1
    api_key: ${MINIMAX_API_KEY}
    model_name: MiniMax-M3.1-Flash
    # Round 129 配额韧性：MiniMax 配额耗尽时 primary 角色调用自动降级到该角色
    fallback_role: secondary
    
  secondary:
    alias: "llm-secondary (审计/确认)"
    # 自建Deepseek网关（非官方 ）
    api_base: https://token.ai-hf.cn/v1
    api_key: ${DEEPSEEK_API_KEY}
    model_name: Deepseek-V4.1-Flash-1017-SS

# ---------- 2. 全局后端开关 ----------
# openai_api = 正常跑量（models 全部为 OpenAI 兼容 HTTP 接口）
# mock       = dry-run / 回归测试（强制所有角色走 MockLLMAdapter）
llm_backend: openai_api

# ---------- 3. HTTP 传输层全局参数（不含模型定义） ----------
openai_api:
  max_retries: 3              # 单次调用失败时的 API 级重试次数
  retry_delay: 5.0            # 重试基础间隔（指数退避：5s → 10s → 20s）
  request_timeout: 300        # 单次请求超时（秒）
  max_concurrent_requests: 4  # 并发请求数

# ---------- 4. 任务路由 ----------
# 任务 → 模型（models 的 key）+ 参数覆盖；params_override 覆盖模型级默认值。
# effort（可选，任务级）：思考档位（合法值见文件头 Effort 约定；缺省=不下发参数）。
#   规范位置：task 下的 `effort:`（params_override.effort 为兼容位置，规范位置优先）。
# extra_body（可选，任务级）：其它供应商特有透传参数，直接并入请求体、
#   优先于适配层归一参数（同名覆盖）；不在 models 段配置。
#   示例：critic_scoring: {model: secondary, extra_body: {thinking_budget: 4096}, params_override: {temperature: 0.1}}
task_routing:
  reference_extraction:        # 典故/隐喻考据（复用直译模型，已并档）
    model: literal_translator
    effort: "none"             # Round 132（网关 300s 硬顶）：Qwen low 档实测推理失控——78k 字符烧光 20k 预算
                               # → 正文空 / 205s+，负载稍高即撞 300s 读超时；关闭思考后四连测 19.5-24.5s 稳定
                               # 出 JSON，召回量不低于低档位（chunk000：10 典故/9 实体 vs 低档 9/4）
    params_override:
      temperature: 0.1
      max_tokens: 20000
  reference_confirmation:      # 两阶段考据 — 召回(Qwen) + 确认(DeepSeek)
    model: secondary
    effort: low                # Round 132：max 档实测超 300s 被网关掐断连接（非流式），low 档 62.6s 稳定出
                               # 正文（推理 18.5k 字符，删误报/补漏仍有效）；需更深核验可选 xhigh（实测 163s）
    params_override:
      temperature: 0.1
      max_tokens: 60000        # DeepSeek max 推理链实测 67518 chars 吃光 20k 预算（Dune 首跑 chunk002→003）；对齐 style_profiling/editor_review 预算
  literal_translation:         # 字面直译
    model: literal_translator
    effort: "none"             # Qwen 档位：直译不需要思考 → 显式关闭（Round 129）
    params_override:
      temperature: 0.1
      max_tokens: 20000
      # 困难片段由难度路由切到 primary/MiniMax 并按段加档（见 pipeline.difficulty_routing）
  literary_rewrite:            # 文学润色
    model: secondary
    effort: max                # DeepSeek 档位：大任务实测 max 稳定出正文（推理约 4k 字符，20.8s）
    params_override:
      temperature: 0.6
      max_tokens: 20000
  critic_scoring:              # 5 维评分（低温提高评分一致性，降低通过率振荡）
    model: secondary           # Jev 可用时 critic 仍优先走 Jev
    effort: "none"             # DeepSeek 档位：结构化评分不需要推理 → 显式关闭（Round 129）
    params_override:
      temperature: 0.1
      max_tokens: 20000
  judge_decision:              # 最终裁决
    model: primary
    effort: max                # MiniMax 档位：最终裁决质量优先
    params_override:
      temperature: 0.3
      max_tokens: 20000
  style_profiling:             # 动态风格剖面（作品隔离；需要文学史判定与风格归纳）
    model: primary
    effort: max                # MiniMax 档位：需要文学史判定 → 开到最高（每书一次，配额友好）
    params_override:
      temperature: 0.2
      max_tokens: 60000        # M3.1-Flash thinking 很长：12k 预算被推理链吃光（Dune 首跑实测 reasoning=40679 chars 无正文）；对齐 editor_review 先例
  editor_review:               # 成书级编辑审读（merge 层级五类缺陷；只报告）
    model: primary
    effort: max                # MiniMax 档位：成书级审读质量优先
    params_override:
      temperature: 0.2
      max_tokens: 60000        # M3.1-Flash thinking 很长：20k 预算会被推理链吃光（实测）
  golden_test:                 # 黄金测试集（与上面 5 类一致，独立列出便于单独调）
    reference_extraction: primary
    reference_confirmation: primary
    literal_translation: literal_translator
    literary_rewrite: primary
    critic_scoring: primary
    judge_decision: primary

# ---------- 4. 流水线调度 ----------
# 章内串行处理 chunk（无假并发旋钮）；全书跨章也默认串行，避免 Decision DB 写竞态
pipeline:
  batch_size: 10              # 单批处理任务数
  max_retries: 3              # 单 chunk API 级失败重试上限（耗尽后进 PERMANENTLY_FAILED）
  max_quality_retries: 5      # Round 118 P1-4（质量优先）: 4→5，给 rewriter 更多修复机会；成本非首要
  max_quality_retries_entity: 4  # P1 优化：实体一致性问题的重试上限（低于通用上限，避免死锁）
  judge_safety_net_avg_min: 5.5  # P0: 安全网阈值——Judge 判 PASS 但 Critic 平均分低于此值时覆盖为 REJECT
  # Round 118 P1-2: REJECT 第二意见 — typesafe verdict 的拒因常只有概率信号，
  # rewriter 无法执行（ch32 实测 REWRITER_STAGNATED）。REJECT 后触发一次
  # judge_decision 角色 LLM 复核，把拒因翻译成逐条可执行编辑并入 specific_edits。
  # 只补指令，不改 decision（绝不弱化 Jev 仲裁）。
  judge_second_opinion:
    enabled: true
    max_edits: 20
    temperature: 0.2
  # Round 118 P1-3: 参考提取两阶段 — DeepSeek 高召回初筛 + MiniMax 逐条确认。
  # 关闭后回退单阶段（召回结果直接采用）。
  reference_two_stage:
    enabled: true
    max_recall_chars: 12000
  # Round 118 P2-5 / Round 128: 直译难度路由 — 典故密度高/长句多/含引文的片段切到更强模型
  # （默认 primary/MiniMax）并按段加档 effort；普通片段仍走任务默认（不下发档位）。
  difficulty_routing:
    enabled: true
    hard_threshold: 2.0
    hard_role: primary
    hard_effort: max             # MiniMax 档位（low/medium/high/xhigh/max）
  # Round 133: 重试适配 — 「仅推理无正文」(no_content) 签名驱动自动降档/换角色救稿。
  # 背景：ch01 通宵跑实测 7 块 PERMANENTLY_FAILED 全部是 effort=max 思考链（5-7 万字符）
  # 吃光 max_tokens、正文为空；同参数重试必然复现（复现率约 100%）。命中签名后：
  #   第 1..N 次重试自动降一档（max→xhigh→high→…，按 provider 合法档位表）；
  #   重试预算耗尽仍未成功 → 换角色再试最后 1 次（RAW 救稿 → secondary；不烧 MiniMax 配额）；
  #   降档后若因质量不合格重进润色 → 升档补偿 1 次（防死循环）。
  # 只对命中签名的块生效，正常块零影响；override 按块持久化到 workflow.db。
  retry_adaptation:
    enabled: true
    downgrade_on_signature: ["no_content"]
    fallback_role_switch: true   # 重试预算耗尽仍未成功 → 换角色救稿 1 次
    minimax_protect: true        # 换角救稿优先 secondary；RAW 救稿不选 primary
    quality_escalate_back: true  # 降档后质量重进润色 → 升档补偿 1 次
  # Round 133: 模型档位探测结果（L1）— tools/probe_llm_efforts.py 写盘；
  # pipeline 启动只读该文件（缺失/过期静默跳过，绝不在流程中自动探测以免烧配额）。
  # 用途：重试降档阶梯按实测 accepted 档位过滤；探测结果带时间戳，ttl_days 到期后忽略。
  model_probe:
    path: db/model_capabilities.json
    ttl_days: 7
    tiny_max_tokens: 16
  # Round 118 P2-8: Jev 配对仲裁 — 早停/兜底定稿时在 top-2 候选稿之间做配对比较,
  # winner 作为最终稿; 不可用/平票时回退最高 critic 分版本（保持原行为）。
  pairwise_arbitration:
    enabled: true
    min_confidence: 0.6
    max_candidates: 4
  # Round 120 L3: 高价值片段双稿仲裁 — verse / pun-dense 片段用 alternate_role
  # （MiniMax-M3）生成第二稿，pairwise（Jev 配对）→ critic 均分 → 首稿 三级择优；
  # sidecar: <chunk>_dual_draft_meta.json。Phase 1 A/B 结论（10 chunk，2026-10-15）：
  # 保留启用（verse/pun 层触发，≤25/章）；Jev pairwise 仲裁为准绳，critic 仅兜底。
  dual_draft:
    enabled: true
    alternate_role: primary
    alternate_effort: max        # Round 129: 第二稿（MiniMax）加到最高档
    max_chunks: 25
  # Round 118 P2-7: 黄金集 A/B（CLI: golden --ab / golden-gate --ab）—
  # 直译阶段 DeepSeek/MiniMax × thinking(on/off) 4 组合全流程对比;
  # 仅 confidence_source=jev 占比 ≥ min_calibrated_ratio 的组合参与推荐/门禁.
  golden_ab:
    min_calibrated_ratio: 0.5
  # Round 118 P2-6: 章节级漂移审计（CLI: drift-audit --chapter ch01 [--jev]）
  # 统计层离线可用；--jev 时附加相邻窗口的 voice_drift/register_match 配对检查。
  drift_audit:
    window: 5
    trend_threshold: 0.25        # 首窗→末窗指标相对变化超过此值 → 漂移警告
    sentence_len_tolerance: 0.30 # 全书均值句长与 profile 基线偏差超过此值 → 警告
  # Round 96: final.json CJK sanity 闸门. 译文 CJK 字符占比低于此值时尝试 fallback 到 literary/raw,
  # 全部失败则标 sanity_failed=true. 0 表示禁用闸门 (向后兼容).
  final_cjk_threshold: 0.5
  # Round 97: CJK 重试耗尽早停. rewriter 反复输出英文 (P3 闸门拦截) 时,
  # 在 cjk_max_retries 次重试后 fallback 到 raw 翻译稿 (raw 经 P2 闸门保证是中文),
  # 节省后续 LLM 调用. 0 = 禁用早停 (走原有 max_quality_retries 流程).
  # Round 118 P1-4（质量优先）: 2→3，CJK 失败会回退 raw（失去文学润色），
  # 多给一次 rewriter + 停滞换模型的机会再放弃.
  cjk_max_retries: 3
  # Round 96 P2: raw 翻译稿必须含中文. ch02 案例中 LLM 返回英文源文, 被喂给 rewriter 连锁失败.
  # raw CJK < 此值 → FAILED 重试 TRANSLATING_RAW (而不是用英文稿推进 REWRITING_LITERARY).
  # 0 表示禁用闸门 (向后兼容). 比 final_cjk_threshold 低, 因为 raw 可含较多英文人名/地名.
  min_raw_cjk_ratio: 0.3
  # Round 98 P1: 实体违规连续 N 次未修复 → 早停 fallback, 节省 rewriter+critic+judge LLM 调用.
  # 触发: 最近 N 次 audit 每次都有 ≥1 个 serious 违规 (variant_instead_of_canonical / missing).
  # 与 CJK 早停并行, 但更激进. Round 118 P1-4（质量优先）: 2→3，
  # 实体命名是硬约束，先让停滞换模型/多一轮修复再早停.
  # 0 = 禁用早停 (走原 max_quality_retries_entity=4 流程).
  entity_stagnation_threshold: 3
  # Round 101 P1: audit 高分直通 — 首轮评分全 ≥ 阈值 + 无实体违规 + CJK 高 → 直接 COMPLETED, 跳过 judge LLM.
  # 与 R99 P3 AUDIT_EARLY_STOP 互补: P3 抓评分差, P1 抓评分好. 默认阈值 8.0 (偏宽松).
  audit_high_pass:
    enabled: true
    high_score_threshold: 8.0
  # Round 98 P2: 非进展 streak. avg_score 连续 N 次单调不增 (含持平) → 早停.
  # 比 _is_declining_streak (严格递减) 更激进, 抓住「rewriter 不恶化但也不进步」场景.
  # 1 = 禁用早停 (走原有 max_quality_retries 流程).
  # Round 118 P1-4（质量优先）: 3→4，非进展早停延后一轮.
  no_progress_window: 4
  # Round 118 P1-4: 严格递减 streak 窗口（_is_declining_streak），默认 4（旧硬编码 3）.
  score_decline_streak: 4
  poll_interval: 0.5          # 状态机轮询间隔（秒）
  entity_hard_fail: true      # 实体一致性严重问题时强制退回润色至少一轮
  entity_hard_fail_degradation_threshold: 3  # 降级阈值：质量重试 > 0 时，严重不一致项 > 此值才强制退回
  # B3 Round 2: variant discovery 门槛（避免变体误发现导致 entity_hard_fail 死循环）
  variant_min_occurrence: 2     # 一字之差的候选变体需在同 chunk 内出现 ≥ 此次数才入注册表
  # Round 105: 默认改为 false。ch32 实测一字之差自动入表把 东西/卡特/警察/伦敦金 等
  # 普通词登记为人名异体，随后被 consistency 3c 盲目替换改坏正文。默认仅 soft-hint
  # 供人工复核；确认需要自动入表时再显式置 true（并配合 variant_min_auto_len 护栏）。
  variant_auto_register: false  # 是否自动写注册表（false = 仅 soft-hint，不污染 registry）
  # Round 105: 硬长度护栏。canonical 长度 < 此值时，即使 variant_auto_register=true
  # 也绝不自动入表（短名的一字之差几乎必为普通词：黛西←东西 / 卡洛←卡特）。
  variant_min_auto_len: 3
  # Round 105: 译后一致性自动修正开关。ch32 实测 dry_run=False 自动修正把
  # 某样东西→某样黛西 / 卡特姆勋爵→卡洛姆勋爵（普通词被当人名异体替换）。
  # 默认 false = 章节末尾仅生成 consistency_diff.md 报告、不落地修改 final.json；
  # 确认报告无误后显式置 true 才自动修正（CLI `consistency --apply` 不受此开关影响）。
  consistency_auto_fix: false
  early_stop:
    enabled: true             # 是否启用早期止损
    max_low_dims: 3           # 低于阈值维度数 ≥ 此值则触发止损
    low_score_threshold: 4.0  # 什么分数算"低分"
    apply_only_first_round: true  # 仅首轮质量裁决生效 early_stop
  # Round 106: 是否信任 mock_heuristic 后端的分数/verdict。
  # Jev API 不可用（如 451 区域封锁）时，critic 回退到 mock 启发式，其分数是确定性
  # 假分数（entity_consistency=0、literal_residue 极低等），judge 还会直接复用其
  # _typesafe_verdict，导致整章 PERMANENTLY_FAILED（ch05 实测 7/7 chunk 全挂）。
  # 默认 false = 不信任：mock 分数不触发 AUDIT_EARLY_STOP / 高分直通，judge 也不复用
  # 其 verdict（强制 LLM 独立裁决，让真正的质量门生效）。
  trust_mock_heuristic: false
  # Round 6: oscillation 早停——连续 retry 译文高度相似说明 LLM 已在"原地打转"
  # 检测到连续 N 次 retry 间相似度 ≥ 阈值 → 直接 fallback，跳过 AUDITING/JUDGING
  # 收益：省 LLM 调用（每次 retry ~5-10s + token 成本）+ 译文最终质量与跑满 6 次 retry 等价
  oscillation_detection:
    enabled: true             # 是否启用 oscillation 早停
    similarity_threshold: 0.95  # 相似度 ≥ 此值视为"无实质改进"
    consecutive_required: 2     # 连续 N 次满足才触发 fallback（避免误杀合法 retry）
    # Round 12: reject_reason 停滞检测（与 similarity 并行运行）
    # 现象：连续 retry 间 reject_reason_summary 完全一致 → Rewriter 没在解决问题
    # 与 similarity 检测互补：similarity 检查 LLM 输出文本相似；stagnation 检查问题清单相似
    stagnation_detection:
      enabled: true             # 是否启用 stagnation 早停
      consecutive_required: 1   # N=1：当前 retry 与前 1 retry reject_reason 一致即触发；N=2：需 3 连一致
      # Round 16: Jev-aware stagnation 模式
      # - category（默认）：比较 primitive category 集合，忽略 noul 浮动（Jev 后端唯一有效模式）
      # - exact：精确字符串匹配（旧 Round 12 行为；Jev 后端下永远不触发）
      # - substring：宽松包含关系
      match_mode: category
      exact_match_only: true    # 兼容旧 key（match_mode 未设置时按此推断）
  # Round 116: 停滞/振荡换模型（生成端多样性破停滞）
  # 现象：字节停滞 (REWRITER_STAGNATED) 时同一模型对同一 prompt 反复输出相同文本，
  # 继续重试只是烧 token。开启后首次停滞不直接 fallback，而是切换到另一角色
  # （DeepSeek ↔ MiniMax-M3）再试一轮；上限 max_switches 次后仍走原 fallback 路径。
  # 换模型不占用 quality_retries 计数，通过 sidecar (rewrite_switch) 记录，便于倒查。
  stagnation_model_switch:
    enabled: true
    alternate_role: primary      # 润色默认角色 secondary(DeepSeek)，停滞时切换至 primary(MiniMax-M3)
    alternate_effort: max        # Round 129: 切到 MiniMax 时加到最高档（救稿路径，质量优先）
    max_switches: 1              # 1=只换一次；2=允许在 base/alt 间来回换
  # Round 7: 译后一致性校正（auto-apply）
  # 章节 run() 完成后自动跑 run_consistency_check_for_chapter，章节级 scope
  # 修复 alias_mixed / english_residue / cjk_variant 三类问题（QA_REPORT 162 处）
  # 与 CLI 子命令 'consistency --apply' 共用核心检测逻辑，行为一致
  post_consistency:
    enabled: true             # 章节完成后是否自动跑 consistency apply
    chapter_scoped: true      # true=仅修当前章节；false=修全部 output/（生产环境慎用）
  # Round 9: 实体完整性审计（纯诊断，不改译文）
  # 章节 run() 完成后扫描所有 final.json，对比 source_text 中的 source_names 与 final_text 是否含 canonical/variant
  # 输出 output/chXX/entity_audit.md：哪些已登记实体被 Rewriter 漏译
  # 用途：定位 Rewriter prompt 改进点（如 ch32 chunk002 漏译"科德斯（Codders）"）
  entity_audit:
    enabled: true             # 是否启用实体完整性审计
    min_chunk_missing_threshold: 1  # 单 chunk 缺失实体数 ≥ 此值才在报告中列出（过滤噪声）
  # Round 13: LLM 调用成本报告（每章 run() 末尾自动生成 cost_report.md）
  # 统计 5 类 task 的调用次数 + 估算 token 数；用于评估 Round 6/12 早停的省钱效果
  cost_report:
    enabled: true             # 是否生成 cost_report.md
  # Round 130: 回溯重跑版本择优 — 重跑新版本 critic 均分低于备份版本时保留旧版
  # （防"重跑用更差版本覆盖已通过版本"；旧版来自 _process_dirty_batch 的 final_backup + critic_report_backup）
  version_merit:
    enabled: true             # 是否启用版本择优
    tolerance: 0.0            # 新版本均分 ≥ 旧版均分 - tolerance 才允许替换；0=只要更低就保留旧版
  # Round 14: intermediate 文件自动清理（章节完成后）
  # 保留 canonical literary.json + final.json + rewrite_meta_vN（最后一次）
  # 删除 literary_v0..vN-1（已被 vN 覆盖） + 早期 rewrite_meta
  # 节省磁盘空间，让 output/ 目录更干净；legacy ch32 (113 v* 文件) 受益最大
  intermediate_cleanup:
    enabled: true             # 是否在 pipeline.run() 末尾自动清理
    preserve_for_failed: true # PERMANENTLY_FAILED chunk 保留全部中间文件（供人工 inspect）
    preserve_meta: true       # 保留 rewrite_meta（最后一次的 meta，诊断用）
  # Round 15: entity_registry source_names 冲突检测（纯诊断）
  # 检测同一英文 source_name 被登记到多个 canonical 的情况
  # 这会导致 consistency.py 不知该用哪个译名（如 "Joe" → 绅士乔 / 安东尼·凯德）
  # 输出 output/chXX/entity_registry_conflicts.md，运维据此手动修复 entity_registry
  entity_registry_audit:
    enabled: true             # 是否启用 entity_registry 冲突检测

# ---------- 5. 文本切分 ----------
chunker:
  soft_limit: 1000            # 软上限（字符），超过则尝试在场景断点处切分
  hard_limit: 2500            # 硬上限，超过则强制切分（不保证场景完整性）
  respect_scene_breaks: true  # 是否优先在 --- / 空行 / 标题 等场景断点处切

# ---------- 5.5 切分后预处理（input_prep） ----------
# 切分 EPUB 时自动执行：① 非正文文档（前页/目录/索引）改写到 _skip/，不参与翻译；
# ② 修复源文件中字间断裂型文本伪影。使「传 epub + --reset」直接产出干净 input/。
input_prep:
  enabled: true
  skip_dir: _skip
  # 命中这些标题（H1，忽略大小写/空白差异）的文档判为前页/索引 → _skip/，不翻译
  skip_titles:
    - "Cover Page"
    - "Title Page"
    - "Copyright Page"
    - "Dedication"
    - "Contents"
    - "Index"
    - "Document Outline"
  # 文本伪影修复表：[旧, 新]，按顺序全局替换（Why Nations Fail 实测 13 处）
  repairs:
    - ["SO CLOSE AND YE T SO DIFFERENT", "SO CLOSE AND YET SO DIFFERENT"]
    - ["PROS PERITY", "PROSPERITY"]
    - ["A ND IT WORKS", "AND IT WORKS"]
    - ["TURNI NG", "TURNING"]
    - ["BAR RIERS", "BARRIERS"]
    - ["D EVELOPMENT", "DEVELOPMENT"]
    - ["EIGHTEENTH - CENTURY", "EIGHTEENTH-CENTURY"]
    - ["MID - NINETEENTH CENTURY", "MID-NINETEENTH-CENTURY"]
    - ["DRIFTIN\n\nG APART", "DRIFTING APART"]
    - ["VIRTUO US", "VIRTUOUS"]
    - ["VICIOU S", "VICIOUS"]
    - ["T HE MOLD", "THE MOLD"]
    - ["UNDERSTANDING PROS\n\nPERITY AND POVERTY", "UNDERSTANDING PROSPERITY AND POVERTY"]

# ---------- 6. 决策回溯引擎 ----------
# 当 Decision DB 中新增某类决策时，是否回溯重译已完成的受影响 chunk
# 仅 COMPLETED 状态可被标 DIRTY；JUDGING 等中间态禁止自脏（防死循环）
decision_engine:
  terminology_triggers_backtrack: true
  reference_triggers_backtrack: true
  # STYLE 默认 false：规则只写入 DB 供后续 chunk 继承，不触发已完成 chunk 重译
  style_triggers_backtrack: false
  max_affected_chunks_per_decision: 50   # 单次决策最多回溯多少个 chunk
  backtrack_scope: book                  # book=全书扫描受影响 chunk；chapter=仅当前章
  # Round 130: 回溯模式与治理预算（防"决策翻转→回溯已完成块→重跑再翻转"自激长跑）
  #   immediate=决策变更立即把受影响已完成块标 DIRTY（旧行为；翻转率高时不收敛）
  #   deferred =变更先登记 pending_backtrack 队列，pipeline 在队列清空点合并应用一次（默认）
  backtrack_mode: deferred
  max_backtrack_sweeps_per_chapter: 1    # deferred: 每章每次运行最多合并回溯 N 轮；0=不合并（登记保留到下次运行）
  max_backtrack_rounds_per_chunk: 2      # 治理计数: 单块累计被回溯重跑上限（跨 episode，两种模式通用）；0=不限制
  context_max_terminology: 40            # 注入 prompt 的术语上限
  context_max_reference: 20
  context_max_style: 10
  context_max_entities: 30

# ---------- 7. Critic 评分门槛 ----------
# P0: 阈值注入 Judge prompt 作为参考（非硬性否决）。
# 本块为「通用默认」下限（保守值），不含任何作品的专属调参。
# 按书覆盖（作品无关原则，Round 130）：写进 input/book_profile.json 的可选
#   "critic_thresholds" 块（只列需要覆盖的维度，0-10 数值）。
# 运行时读取顺序：book_profile 覆盖 > 本块默认
#   （见 src/config.py::Config.critic_thresholds_for_book）。
critic_thresholds:
  fluency: 6.5
  readability: 6.5
  style_compliance: 6.0
  voice_consistency: 6.0
  semantic_preservation: 6.5
  literal_residue: 6.5   # P4: 新增维度，检测直译残留
  average_score_min: 6.5

# ---------- 7.5. typesafe-ai (Jev) verdict 阈值 ----------
# Round 8: 与 critic_thresholds 并列，专用于 Jev System One verdict 合成
# 字段名与 src/judges/verdict.py::DEFAULT_THRESHOLDS 一一对应
# 调高 literal_residue/semantic_loss 阈值 → 减少非真实问题的 reject/retry
# 保留 entity_consistency 严格（0.3）—— 命名一致是 binary 判定，无放宽空间
typesafe_thresholds:
  voice_drift_severe_prob: 0.5
  voice_drift_subtle_prob: 0.7
  register_mismatch_prob: 0.4
  entity_consistency_noul: 0.3          # 保持严格：命名一致性是硬约束
  literal_residue_noul: 0.6             # 0.5 → 0.6：文学翻译容许少量直译痕迹
  semantic_loss_noul: 0.55              # 0.4 → 0.55：边界值（避免 noul=0.5 噪声触发）
  style_compliance_min_score: 1.0
  style_compliance_min_confidence: 0.6
  low_confidence_threshold: 0.5
  # Round 95: CJK Choice/Score 置信门槛.
  # typesafe.ai 官方 models.md / state.md 警告 Jev 在 CJK 上准确率较低.
  # 对 Choice/Score 答案, 使用比通用 (0.5) 更高的置信门槛 (默认 0.6),
  # 让边界判断走 skipped_dimensions 而非触发 hard reject.
  # 关闭 CJK gating: 设 cjk_confidence_gating=false 即回到通用 0.5 门槛.
  cjk_confidence_gating: true
  cjk_low_confidence_threshold: 0.6
  # Round 96 P3: 译文 CJK 比例硬性闸门. 在 critic/judge 阶段直接拦截低 CJK 输出,
  # 触发 rewriter 重试 (而不是等到 final 才发现). 0 = 禁用 (向后兼容).
  cjk_hard_threshold: 0.5
  # Round 60: Noul uncertain zone（typesafe-ai consistency_noul_cookbook 推荐）
  # 区间内 Noul 视为边界不推导，不参与 hard reject 门控；防止 Jev 在 CJK 上的
  # 边界概率（noul=0.4~0.6）触发 rewriter 死循环震荡。
  noul_uncertain_low: 0.3
  noul_uncertain_high: 0.7
  # Round 72: per-dimension uncertain zones. entity_consistency 严格 (0.3-0.7),
  # literal_residue / semantic_loss 放宽到 (0.3-0.8), 抑制 Jev/Mock 边缘噪声.
  noul_uncertain_zones:
    entity_consistency: [0.3, 0.7]
    literal_residue: [0.3, 0.8]
    semantic_loss: [0.3, 0.75]
  # Round 118 P1-1: confidence_source 分档（绝不弱化 Jev）。
  # Jev 是校准概率，按上面阈值原样裁决；openai_compat（LLM 自报伪概率）与
  # mock_heuristic（确定性启发式）属未校准来源：reject 门槛 +margin、
  # 置信门控 +margin、Noul 不确定区间上界 +margin（边界噪声走保守跳过）。
  # 可用 confidence_source_profiles 覆盖代码内默认值（见 verdict.py）。
  confidence_source_profiles:
    openai_compat:
      calibrated: false
      reject_margin: 0.15
      confidence_margin: 0.15
    mock_heuristic:
      calibrated: false
      reject_margin: 0.25
      confidence_margin: 0.20

# ---------- 8. 风格指南 ----------
# Round 117 P0: 本段只保留「与作品无关」的通用基线；作品特定的体裁/时代/语域/
# 俚语提示一律由 StyleProfiler 抽样原文动态生成（input/book_profile.json），
# 运行时经 config.set_runtime_style_guide() 覆盖本段。翻译新书前先运行：
#   python3 -m src.translator_agent style-profile
style_guide:
  avg_sentence_length: 适中、口语化，贴近原文句式长度
  lexicon_preference: 平实、克制，避免过度意译、四字格堆砌与装饰性发明
  author_priority_ratio: 0.7   # 0=译者主导  1=作者主导（动态 _build_style_guide 据此选高作者优先级模式）
  genre: 文学小说               # 体裁兜底（剖面生成后由 profile 覆盖）
  work_type: 长篇小说            # 作品类型（注入各 Agent prompt）

  # ── 通用兜底（无 profile 时使用；有 profile 时被覆盖）──────────────
  persona: 忠实原著语域的职业文学译者
  footnote_policy: inline        # none=禁止脚注 | inline=文内括号简注 | markdown_footnote=Markdown脚注
  register_default: 保持克制、平实、贴近原文的叙事语域
  translation_hints: []          # 作品特定用词/引用提示（由 profile 生成；此处置空=不注入先验）
  forbidden_modernisms:          # 禁用词（直译残留或不符合时代语域的表达）
    - 娘们儿
    - 卧槽
    - 开后宫
    - 老铁
    - 666

# ---------- 9. 路径 ----------
paths:
  db_dir: db
  input_dir: input
  output_dir: output
  docs_dir: docs
  golden_test_file: input/golden/hyperion_5k.md
  decision_db: decision_db.sqlite
  workflow_db: workflow.db

# ---------- 10. 日志 ----------
logging:
  level: INFO                  # DEBUG / INFO / WARNING / ERROR
  log_llm_calls: false         # 是否打印每个 LLM 调用的完整 prompt/response
  perf_log_interval: 10        # 每处理 N 个 chunk 打印一次性能统计

# ---------- 11. typesafe-ai System One 后端（T2 重构引入） ----------
# 该节配置 src/judges/typesafe_backend.py::FallbackBackend 的实例化参数。
# 字段说明：
#   enabled               — 是否启用 typesafe 路径（false 时直接走 Mock）
#   api_base              — 文档用途，typesafe_sdk 内部使用其默认 endpoint；留作未来扩展
#   api_key               — TYPESAFE_API_KEY，无值时跳过 Jev
#   model_name            — Jev 模型名（默认 jev-latest，对应 typesafe.ai System One）
#   fallback_role         — OpenAICompat 降级时使用的角色 key（指向顶层 models.<role>）
#   allow_mock            — Jev 不可达时是否降级到 MockBackend（启发式离线）
#   allow_openai_fallback — 是否允许降级到 OpenAICompat（默认 false）
#                           关闭原因：OpenAICompat 不返回校准概率，与 Jev 语义不等价，
#                           强行 fallback 会让 verdict 失去概率含义（详见 audit A3）。
#                           仅在 A/B 调试或本地无 Jev 场景下显式开启。
#   timeout               — 单次 system_one 调用超时（秒）
typesafe:
  enabled: true
  api_base: https://api.typesafe.ai
  api_key: ${TYPESAFE_API_KEY}
  model_name: jev-latest
  fallback_role: primary
  allow_mock: true
  # Round 106 P3 引入 OpenAICompat 降级作为容灾路径。Round 116 更正：Jev 当前
  # 实际可用（1013 全量运行 critic 报告 _backend_path=jev, 387/387），此前的
  # 451 区域封锁已不成立；fallback 仅在 Jev 超时/不可达时启用。
  # 注意：fallback_role=primary（MiniMax-M3）按 typesafe schema 评分时 confidence
  # 为 LLM 自报，与 Jev 校准概率语义不同——下游阈值需按 backend source 区分处理，
  # 不得混用同一套门槛（详见 Round 116 计划：confidence_source 建模）。
  # Round 125: OpenAICompatBackend 实际取 `critic_scoring` 路由的 client
  # （现为 secondary/Qwen）; 本键 `fallback_role` 仅作历史兼容, 不再决定该路径模型。
  allow_openai_fallback: true
  timeout: 30.0

# =====================================================================
# 成书样式（Round 119 T5）
# =====================================================================
# chapter_titles: 合并层章节标题制式
#   bilingual - 中文主标题＋原文括注（默认，如 "第一章 掉进兔子洞（Down the Rabbit-Hole）"）
#   zh        - 仅中文主标题
#   keep      - 保留 input/<ch>.md 原始 H1（清理 Gutenberg 前缀）
book:
  chapter_titles: bilingual

# =====================================================================
# 韵文通道（Round 119 L1）
# =====================================================================
# enabled        — 总开关（false：转换层不标记韵文、init 不写 chunk_tags、
#                  prompt 不注入韵文协议、gate 跳过 verse_lint；回到旧行为）
# min_line_ratio — verse_lint 行数对齐下限：译文诗行数 ≥ 源行数 × ratio
# max_line_chars — 认定「诗行」的最大行长（字符，超长行视为散文行，不计入）
# refrain_ratio  — 复沓（refrain）保留下限：译文重复数 ≥ 源重复数 × ratio
# retry_on_fail  — PASS 定稿前 verse_lint 未达标时，是否触发一次定向重写
verse:
  enabled: true
  min_line_ratio: 0.6
  max_line_chars: 56
  refrain_ratio: 0.5
  retry_on_fail: true
