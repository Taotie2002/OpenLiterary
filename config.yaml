# =====================================================================
# OpenLiterary 全局配置
# =====================================================================
#
# 1. 角色级 LLM 配置（main.models 段）
# ---------------------------------------------------------------------
# 6 个角色 = 6 个独立模型，本地 MLX 和云端 API 自由混搭。
# 每个角色必须指定 backend + 模型标识，互不依赖，无 fallback。
#
#   reference     - 典故/隐喻考据提取
#   literal       - 字面直译
#   rewriter      - 文学润色
#   critic        - 5 维评分审辩
#   judge         - 最终裁决
#   golden        - 黄金测试集评估
#
# 支持 backend:
#   mlx          - Apple Silicon 本地推理 (model_id = 本地目录路径)
#   openai_api   - 任意 OpenAI 兼容 HTTP API (api_base + api_key + model_name)
#   mock         - 开发测试，不调用真实 LLM
#
# 2. 临时覆盖（不修改本文件）
# ---------------------------------------------------------------------
# 通过环境变量覆盖任意字段，__ 为嵌套分隔符：
#   export OPENLITERARY__MAIN__MODELS__CRITIC__MODEL_NAME=mistral-large
#   export OPENLITERARY__MAIN__MODELS__CRITIC__API_BASE=https://api.mistral.ai/v1
#   export OPENLITERARY__MAIN__MODELS__CRITIC__API_KEY=$MISTRAL_KEY
#
# api_key 推荐用 ${ENV} 占位符，运行时从环境变量注入，无需明文落盘。
# =====================================================================

# ---------- 1. 6 个角色定义（一个角色 = 一个模型） ----------
main:
  models:
    # 典故/隐喻考据提取（低温精确）
    reference:
      backend: openai_api
      api_base: https://api.minimaxi.com/v1
      api_key: ${MINIMAX_API_KEY}
      model_name: MiniMax-M3
      alias: 参考提取 (云端)
      extra_body: {}

    # 字面直译（低温忠实）
    literal:
      backend: mlx
      model_id: /Users/taotie/LLM/HY-MT1.5-7B-4bit
      alias: 直译 (本地)
      extra_body: {}

    # 文学润色（高温创意）
    rewriter:
      backend: mlx
      model_id: /Users/taotie/LLM/HY-MT1.5-7B-4bit
      alias: 润色 (本地)
      extra_body: {}

    # 5 维评分审辩（低温一致）
    critic:
      backend: openai_api
      api_base: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      model_name: deepseek-v4-flash
      alias: 审辩 (云端)
      extra_body: {}

    # 最终裁决
    judge:
      backend: openai_api
      api_base: https://api.minimaxi.com/v1
      api_key: ${MINIMAX_API_KEY}
      model_name: MiniMax-M3
      alias: 裁决 (云端)
      extra_body: {}

    # 黄金测试集评估
    golden:
      backend: mlx
      model_id: /Users/taotie/LLM/qwen3-0.6b-transcriber-4bit
      alias: 黄金测试 (本地)
      extra_body: {}

# ---------- 2. 任务路由（1 对 1 映射，无 fallback） ----------
task_routing:
  reference_extraction:        # 典故/隐喻考据 → reference
    model: reference
    params:
      temperature: 0.1
      max_tokens: 20000
      max_retries: 3
      retry_delay: 5.0
      request_timeout: 300

  literal_translation:         # 字面直译 → literal
    model: literal
    params:
      temperature: 0.1
      max_tokens: 20000
      max_retries: 3
      retry_delay: 5.0
      request_timeout: 300

  literary_rewrite:            # 文学润色 → rewriter
    model: rewriter
    params:
      temperature: 0.6
      max_tokens: 20000
      max_retries: 3
      retry_delay: 5.0
      request_timeout: 300

  critic_scoring:              # 5 维评分 → critic
    model: critic
    params:
      temperature: 0.1
      max_tokens: 20000
      max_retries: 3
      retry_delay: 5.0
      request_timeout: 300

  judge_decision:              # 最终裁决 → judge
    model: judge
    params:
      temperature: 0.3
      max_tokens: 20000
      max_retries: 3
      retry_delay: 5.0
      request_timeout: 300

  golden_test:                 # 黄金测试集 → golden（独立列出便于单独调）
    reference_extraction: reference
    literal_translation: literal
    literary_rewrite: rewriter
    critic_scoring: critic
    judge_decision: judge

# ---------- 3. 流水线调度 ----------
pipeline:
  batch_size: 10
  max_retries: 3               # API 级失败重试上限（耗尽后进 PERMANENTLY_FAILED）
  max_quality_retries: 6       # 质量重试上限（Judge 不通过 → Rewriter）
  max_quality_retries_entity: 4  # 实体一致性问题重试上限（防死锁）
  judge_safety_net_avg_min: 5.5  # 安全网：Judge 判 PASS 但 Critic 均分低于此 → 覆盖 REJECT
  poll_interval: 0.5
  entity_hard_fail: true
  entity_hard_fail_degradation_threshold: 3
  early_stop:
    enabled: true
    max_low_dims: 3
    low_score_threshold: 4.0
    apply_only_first_round: true

# ---------- 4. 文本切分 ----------
chunker:
  soft_limit: 500
  hard_limit: 1200
  respect_scene_breaks: true

# ---------- 5. 决策回溯引擎 ----------
decision_engine:
  terminology_triggers_backtrack: true
  reference_triggers_backtrack: true
  style_triggers_backtrack: false
  max_affected_chunks_per_decision: 50
  backtrack_scope: book
  context_max_terminology: 40
  context_max_reference: 20
  context_max_style: 10
  context_max_entities: 30

# ---------- 6. Critic 评分门槛 ----------
# 阈值注入 Judge prompt 作为参考（非硬性否决）
critic_thresholds:
  fluency: 6.5
  readability: 6.5
  style_compliance: 6.0
  voice_consistency: 6.0
  semantic_preservation: 6.5
  average_score_min: 6.5

# ---------- 7. 风格指南 ----------
style_guide:
  avg_sentence_length: 适中、口语化，贴近原文句式长度
  lexicon_preference: 平实、克制、英式幽默，避免过度意译、四字格堆砌与装饰性发明
  author_priority_ratio: 0.7
  genre: 儿童文学/维多利亚童话
  work_type: 长篇童话

# ---------- 8. 路径 ----------
paths:
  db_dir: db
  input_dir: input
  output_dir: output
  docs_dir: docs
  golden_test_file: input/golden/hyperion_5k.md
  decision_db: decision_db.sqlite
  workflow_db: workflow.db

# ---------- 9. 日志 ----------
logging:
  level: INFO
  log_llm_calls: false
  perf_log_interval: 10
